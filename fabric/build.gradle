plugins {
    id 'multiloader-fabric'
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper

sourceSets {
    gametest {
        java.srcDir('src/gametest/java')
        resources.srcDir('src/gametest/resources')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + sourceSets.main.runtimeClasspath + configurations.testCompileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

configurations {
    // Mods added to the dedicated gametest server only (see runGameTestServer): Lithostitched replaces vanilla's jigsaw
    // placement for every jigsaw structure and Trek is the mod Bountiful's Lithostitched modifiers target, so
    // the village board tests must run with both. -PnoTrekTests leaves them out.
    trekTestMods { transitive = false }
    gametestCompileOnly.extendsFrom(compileOnly)
    gametestImplementation.extendsFrom(implementation)
    gametestImplementation.extendsFrom(testImplementation)
    gametestRuntimeOnly.extendsFrom(runtimeOnly)
    gametestRuntimeOnly.extendsFrom(testRuntimeOnly)
}

repositories {
    mavenLocal()
    maven {
        name = "Architectury Maven"
        url = uri("https://maven.architectury.dev/")
    }
    // Cloth Config (optional dependency) from the Modrinth Maven
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = uri("https://api.modrinth.com/maven")
            }
        }
        filter {
            includeGroup("maven.modrinth")
        }
    }
}

dependencies {
    implementation("io.ejekta.kambrik:kambrik-fabric-${minecraft_version}:${kambrik_version}")
    implementation("io.ejekta.percale:percale-fabric-${minecraft_version}:${percale_version}")
    // Dev-environment only; ModMenu is never a hard dependency of the mod itself
    // Pass -PnoOptionalMods to leave ModMenu and Cloth Config out of dev runs (tests starting without them)
    if (!project.hasProperty('noOptionalMods')) {
        runtimeOnly "com.terraformersmc:modmenu:${mod_menu_version}"
    }
    // Cloth Config is optional at runtime (fabric.mod.json "suggests"): only the config screen in the client
    // entrypoint package references it, and ModMenu only loads that class when Cloth is present
    compileOnly "maven.modrinth:cloth-config:${cloth_config_fabric_version}"
    if (!project.hasProperty('noOptionalMods')) {
        runtimeOnly "maven.modrinth:cloth-config:${cloth_config_fabric_version}"
    }
    if (!project.hasProperty('noTrekTests')) {
        trekTestMods "maven.modrinth:lithostitched:${lithostitched_version}"
        trekTestMods "maven.modrinth:trek:${trek_version}"
    }
    gametestCompileOnly "maven.modrinth:cloth-config:${cloth_config_fabric_version}"
    gametestCompileOnly "com.terraformersmc:modmenu:${mod_menu_version}"
    compileOnly "com.terraformersmc:modmenu:${mod_menu_version}"
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.gametest
            sourceSet sourceSets.main
        }
    }
    runs {
        gameTestServer {
            server()
            source sourceSets.gametest
            setConfigName('Fabric Game Test Server')
            ideConfigGenerated(true)
            runDir('runs/gametest')
            vmArg('-Dfabric-api.gametest=true')
            if (project.hasProperty('villageSamples')) {
                vmArg("-Dbountiful.villageSamples=${project.property('villageSamples')}")
            }
            vmArg("-Dfabric-api.gametest.report-file=${file("$buildDir/reports/game_test/results.xml").absolutePath}")
        }
        // Fabric API client gametest (needs a display). Run: ./gradlew :fabric:runClientGameTest
        // Screenshots: fabric/build/run/clientGameTest/screenshots
        clientGameTest {
            client()
            source sourceSets.gametest
            setConfigName('Fabric Client Game Test')
            ideConfigGenerated(false)
            runDir('build/run/clientGameTest')
            vmArg('-Dfabric.client.gametest')
            programArg('--username')
            programArg('Player0')
        }
    }
}

tasks.named('compileGametestKotlin') {
    source(project(':common').fileTree('src/gametest/java'))
}

tasks.named('processGametestResources') {
    dependsOn(tasks.named('processResources'))
    from(project(':common').file('src/gametest/resources'))
    duplicatesStrategy = DuplicatesStrategy.WARN
    doLast {
        def mainMetadata = new JsonSlurper().parse(file("$buildDir/resources/main/fabric.mod.json")) as Map
        def entrypoints = new LinkedHashMap(mainMetadata.entrypoints as Map)
        entrypoints['fabric-gametest'] = ['io.ejekta.bountiful.test.BountifulFabricGameTest']
        entrypoints['fabric-client-gametest'] = ['io.ejekta.bountiful.test.BountifulClientGameTest']
        def gametestMetadata = new LinkedHashMap(mainMetadata)
        gametestMetadata.entrypoints = entrypoints
        file("${destinationDir}/fabric.mod.json").text = JsonOutput.prettyPrint(JsonOutput.toJson(gametestMetadata))
    }
}

tasks.named('jar', Jar) {
    dependsOn(tasks.named('processResources'))
    // INCLUDE wrote fabric.mod.json twice, which Loom's manifest step rejects ("duplicate entry")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from("$buildDir/resources/main") {
        include('fabric.mod.json')
    }
}

tasks.named('runGameTestServer') {
    dependsOn(tasks.named('gametestClasses'))
    // Also -PextraMods=/dir/with/jars to load further mods
    doFirst {
        def jars = configurations.trekTestMods.files.collect { it.absolutePath }
        if (project.hasProperty('extraMods')) {
            jars += file(project.property('extraMods')).listFiles().findAll { it.name.endsWith('.jar') }.collect { it.absolutePath }
        }
        if (!jars.isEmpty()) {
            jvmArgs("-Dfabric.addMods=${jars.join(File.pathSeparator)}")
        }
    }
}

tasks.named('runClientGameTest') {
    dependsOn(tasks.named('gametestClasses'))
    def runDirectory = file("$buildDir/run/clientGameTest")
    doFirst {
        // Fresh run dir each time (the world is created by the test); the integrated server needs the EULA file
        delete(runDirectory)
        runDirectory.mkdirs()
        new File(runDirectory, 'eula.txt').text = 'eula=true\n'
    }
}
